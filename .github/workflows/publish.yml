name: publish

# Publishes org.sophie:sophie-common-security to GitHub Packages. Same pattern as sophie-protos'
# publish.yml — tag-driven, DECLARED_VERSION-guarded, no PAT required.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Inlined rather than the shared Sophie-KC/sophie-ci/.github/actions/setup-java-gradle composite
      # action: that cross-repo action reference fails to resolve ("Unable to resolve action ... not
      # found") even though sophie-ci's Access setting is org-wide and every permission/content check
      # comes back clean — a standing bug specific to composite-ACTION references (the
      # *reusable-workflow* form every service's build.yml uses, `.../workflows/X.yml@v1`, is
      # unaffected). Same fix already applied in sophie-protos' publish.yml — these three steps are
      # exactly what that action runs.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          DECLARED="$(./gradlew -q printVersion)"
          echo "tag=$GITHUB_REF_NAME  tagVersion=$TAG_VERSION  declared=$DECLARED"
          if [ "$TAG_VERSION" != "$DECLARED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match build.gradle DECLARED_VERSION ($DECLARED). Bump DECLARED_VERSION or fix the tag."
            exit 1
          fi

      # compileOnly org.sophie:sophie-protos needs authenticated read access to that (private) package
      # even just to build — GitHub's Maven registry 401s an unauthenticated GET even for an org
      # member's own repo. Missing here (only the later Publish step had these), never caught before
      # because this workflow's runner-setup step failed first, every time, until the composite-action
      # fix above.
      - name: Build & verify
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew clean build

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ./gradlew publish -PreleaseVersion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew publish
          fi
