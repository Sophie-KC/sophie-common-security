name: publish

# Publishes org.sophie:sophie-common-security to GitHub Packages. Same pattern as sophie-protos'
# publish.yml — tag-driven, DECLARED_VERSION-guarded, no PAT required.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Sophie-KC/sophie-ci/.github/actions/setup-java-gradle@v1

      - name: Verify tag matches declared version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          DECLARED="$(./gradlew -q printVersion)"
          echo "tag=$GITHUB_REF_NAME  tagVersion=$TAG_VERSION  declared=$DECLARED"
          if [ "$TAG_VERSION" != "$DECLARED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match build.gradle DECLARED_VERSION ($DECLARED). Bump DECLARED_VERSION or fix the tag."
            exit 1
          fi

      - name: Build & verify
        run: ./gradlew clean build

      - name: Publish to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ./gradlew publish -PreleaseVersion="${GITHUB_REF_NAME#v}"
          else
            ./gradlew publish
          fi
